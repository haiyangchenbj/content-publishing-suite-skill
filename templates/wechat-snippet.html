<!-- 微信可粘贴片段模板：全内联样式，每段用 <section> 包裹，文末 <v2></v2>。 -->
<!-- 替换 {{...}} 占位符；不要保留此注释块（微信会过滤但不报错）。 -->

<section style="text-align:center;padding:24px 16px 8px;">
  <h1 style="font-size:22px;font-weight:700;color:#1a3a5c;margin:0;line-height:1.4;">{{TITLE}}</h1>
</section>

<section style="padding:6px 16px;">
  <p style="font-size:16px;line-height:1.8;color:#333;margin:0 0 12px;">{{LEAD_PARAGRAPH}}</p>
</section>

<section style="padding:18px 16px 6px;">
  <span style="display:inline-block;width:4px;height:17px;background:#1a3a5c;margin-right:8px;vertical-align:middle;"></span><strong style="font-size:17px;font-weight:700;color:#1a3a5c;vertical-align:middle;">{{SECTION_HEADING}}</strong>
</section>

<section style="padding:6px 16px;">
  <p style="font-size:16px;line-height:1.8;color:#333;margin:0 0 12px;"><strong style="color:#1a3a5c;">{{KEY_JUDGMENT}}</strong>{{BODY_PARAGRAPH}}</p>
</section>

<section style="padding:10px 16px;">
  <p style="font-size:15px;line-height:1.8;color:#555;background:#f5f7fa;padding:12px 14px;margin:0;border-radius:6px;">{{QUOTE}}</p>
</section>

<section style="height:1px;background:#eee;margin:12px 16px;"></section>

<section style="padding:6px 16px;">
  <p style="font-size:14px;line-height:1.6;color:#999;margin:0;">{{AUTHOR}} · {{DATE}}</p>
</section>

<v2></v2>
